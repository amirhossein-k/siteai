name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key:  ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # Deploy #52 root cause: appleboy/ssh-action runs a NON-interactive
            # SSH session, which never sources ~/.nvm/nvm.sh — so the nvm-managed
            # toolchain is not on PATH and `npm` was "command not found" even
            # though node v22.23.4 is installed on the VPS. Load nvm explicitly,
            # then explicitly ensure the project's known node bin dir is on PATH
            # (before the first npm invocation, both as the required guarantee
            # and as a fallback if nvm.sh is ever absent).
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # shellcheck disable=SC1091
              . "$NVM_DIR/nvm.sh"
            fi
            export PATH="$HOME/.nvm/versions/node/v22.23.4/bin:$PATH"

            echo "==> Toolchain check"
            node --version
            npm --version

            cd /home/deploy/siteai

            echo "==> Fetch latest code"
            git fetch origin master
            git reset --hard origin/master

            echo "==> Install dependencies"
            npm ci

            echo "==> Build application"
            npm run build

            echo "==> Restart application"
            pm2 restart siteai

            echo "==> Wait for application"
            sleep 5

            echo "==> Health check"
            curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/health

            echo
            echo "==> Deployment successful"
