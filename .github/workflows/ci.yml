name: CI

# Session 60 — Production Readiness tranche 2: automated enforcement for the
# Session 58 (Vitest 152/152) + Session 59 (Playwright 21/21) test layers.
#
# Design (approved Session 60 design — frozen):
# - Four independent merge-gating jobs run in parallel on every push/PR:
#   `static` (tsc + scoped eslint — the project's established gates) · `unit`
#   (Vitest — hermetic, no DB/network) · `e2e` (Playwright — hermetic via the
#   dev-only ZARINPAL_MOCK seam + a fresh MongoDB service container, so NO
#   CI secrets are required; global-setup auto-seeds the admin + per-run users)
#   · `build` (Session 89 — `next build` must succeed; hermetic: the build is
#   DB-independent and needs only the CI-only placeholder env in that job).
# - Lint gate scope: `src/lib tests/unit tests/e2e` — the surface the project
#   actually keeps lint-clean (money-critical helpers + both test layers).
#   Project-wide `npm run lint` reports 174 PRE-EXISTING errors across
#   scripts/* and src/** (documented debt, Milestone 15) — deliberately NOT a
#   merge gate; the repo convention has always been "ESLint clean on changed
#   files", never whole-project. Session 89 ADDED `next build` as a gate (the
#   `build` job below) — it passes on a network-enabled runner; its only
#   external dependency is the Google Fonts fetch done by next/font at build
#   time (a runner without outbound network would fail that step).
# - The full 33-suite real-sandbox regression lives in the separate
#   `regression.yml` nightly workflow (needs real Zarinpal/Liara/Telegram
#   secrets) — it must never block merges.
#
# Invariants: zero application-code changes; `playwright.config.ts` already
# carries the CI switches (retries: 2, fresh webServer with ZARINPAL_MOCK=1,
# reuseExistingServer: !CI), so this file is pure orchestration.

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs for the same branch/PR — a new push aborts the
# previous run's still-running jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static (tsc + eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint (scoped — src/lib + both test layers)
        run: npx eslint src/lib tests/unit tests/e2e

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Session 89 — production-build gate. `next build` is hermetic: it needs NO
    # database (verified — the build succeeds with an unreachable MONGODB_URI)
    # and no real secrets. The values below are CI-only placeholders, present
    # because the build evaluates two fail-fast guards: NEXT_PUBLIC_APP_URL
    # (src/lib/constants.ts) and the required env vars (src/lib/env.ts).
    env:
      NEXT_PUBLIC_APP_URL: https://example.com
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-build-only-nextauth-secret
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fresh MongoDB — the E2E suite is hermetic against an empty DB:
    # global-setup seeds the admin (idempotent) + creates per-run supplier and
    # customer via the real APIs; global-teardown removes exactly the run's
    # PREFIX'd rows. No secrets required.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017
      # CI-only values (never a real secret) — required by NextAuth JWT signing
      # and callback derivation in the webServer-booted dev server.
      NEXTAUTH_SECRET: ci-e2e-only-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Cache BEFORE the install so a hit skips the ~150MB browser download
      # (restore-after-install would make the cache useless).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        run: npx playwright test --grep-invert "Liara upload integration"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
